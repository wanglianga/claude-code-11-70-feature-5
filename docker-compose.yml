services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
      POSTGRES_DB: ccdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d ccdev"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://ccdev:ccdev@db:5432/ccdev
      SECRET_KEY: change-me-in-prod
      INGEST_TOKEN: ingest-dev-token
      WRITE_LATENCY_THRESHOLD_MS: "800"
      REVIEW_LEDGER_MODE: "checkpoint"
      REVIEW_CHECKPOINT_INTERVAL_SEC: "300"
      REVIEW_RETENTION_DAYS: "365"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
